# 服务端口配置
server.port=8222
# 应用名称配置
spring.application.name=service-gateway
# Nacos服务注册中心地址配置
spring.cloud.nacos.discovery.server-addr=192.168.47.1:8848
# 开启服务发现路由功能
spring.cloud.gateway.discovery.locator.enabled=true
# 医院服务路由配置
spring.cloud.gateway.routes[0].id=service-hosp
spring.cloud.gateway.routes[0].uri=lb://service-hosp
spring.cloud.gateway.routes[0].predicates=Path=/*/hosp/**

# 公共服务路由配置
spring.cloud.gateway.routes[1].id=service-cmn
spring.cloud.gateway.routes[1].uri=lb://service-cmn
spring.cloud.gateway.routes[1].predicates=Path=/*/cmn/**

# 用户服务路由配置
spring.cloud.gateway.routes[2].id=service-user
spring.cloud.gateway.routes[2].uri=lb://service-user
spring.cloud.gateway.routes[2].predicates=Path=/*/user/**

# 短信服务路由配置
spring.cloud.gateway.routes[3].id=service-msm
spring.cloud.gateway.routes[3].uri=lb://service-msm
spring.cloud.gateway.routes[3].predicates= Path=/*/msm/**

# 对象存储服务路由配置
spring.cloud.gateway.routes[4].id=service-oss
spring.cloud.gateway.routes[4].uri=lb://service-oss
spring.cloud.gateway.routes[4].predicates= Path=/*/oss/**

# 订单服务路由配置
spring.cloud.gateway.routes[5].id=service-orders
spring.cloud.gateway.routes[5].uri=lb://service-orders
spring.cloud.gateway.routes[5].predicates= Path=/*/order/**

# 统计服务路由配置
spring.cloud.gateway.routes[6].id=service-sta
spring.cloud.gateway.routes[6].uri=lb://service-sta
spring.cloud.gateway.routes[6].predicates= Path=/*/statistics/**

# 网关全局鉴权配置
# 鉴权开关
gateway.auth.enabled=true
# 免鉴权白名单（Ant 风格）：手机验证码登录、发送验证码、微信扫码回调、医院公开查询/数据对接（有签名校验）、数据字典；管理端 /admin/** 与 /user/hosp/** 沿用课程模板占位登录，后续接入真实账号体系后移出白名单
gateway.auth.white-list=/api/user/login,/api/msm/**,/api/user/wx/**,/api/hosp/**,/*/cmn/**,/admin/**,/user/hosp/**
