# 服务器配置
server.port=8205
# Spring应用配置
spring.application.name=service-oss
spring.profiles.active=dev


# 文件上传配置
# 设置单个文件最大大小为1024MB
spring.servlet.multipart.max-file-size=1024MB
# 设置整个请求最大大小为1024MB
spring.servlet.multipart.max-request-size=1024MB


# 阿里云OSS配置
# 阿里云OSS服务端点
aliyun.oss.file.endpoint=oss-cn-beijing.aliyuncs.com
# 阿里云OSS访问密钥ID
aliyun.oss.file.keyid=${ALIYUN_OSS_KEY_ID:}
# 阿里云OSS访问密钥Secret
aliyun.oss.file.keysecret=${ALIYUN_OSS_KEY_SECRET:}

# 阿里云OSS存储桶名称
aliyun.oss.file.bucketname=yygh

# Nacos服务发现配置
# Nacos服务器地址
spring.cloud.nacos.discovery.server-addr=192.168.47.1:8848
